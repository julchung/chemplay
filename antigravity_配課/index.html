<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教師配課系統</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header>
            <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
                <div>
                    <h1>教師配課系統</h1>
                    <p>請從右方拖曳課程標籤至左方表格中分配，總時數會自動計算。</p>
                </div>
                <div style="display: flex; gap: 10px;">
                    <button id="save-btn" class="btn-secondary">儲存</button>
                    <input type="file" id="load-file-input" accept=".json" style="display: none;">
                    <button id="load-btn" class="btn-secondary">載入</button>
                    <button id="print-btn" class="btn-primary">列印</button>
                </div>
            </div>
        </header>
        <main class="main-content">
            <div class="table-section">
                <table id="schedule-table">
                    <thead>
                        <tr>
                            <th width="5%">操作</th>
                            <th width="15%">教師姓名</th>
                            <th width="15%">職務</th>
                            <th width="45%">課務</th>
                            <th width="10%">總時數</th>
                            <th width="10%">超鐘點數</th>
                        </tr>
                    </thead>
                    <tbody id="table-body">
                        <!-- Rows will be generated by JS -->
                    </tbody>
                    <tfoot>
                        <tr>
                            <td style="text-align: center;">
                                <button id="add-teacher-btn" class="btn-primary" style="padding: 4px 8px; font-size: 0.85rem; background-color: #20c997; border-color: #20c997;">+ 新增</button>
                            </td>
                            <td colspan="5" style="color: #777; font-size: 0.9em; vertical-align: middle; padding-left: 10px;">點擊左側按鈕新增空白教師欄位</td>
                        </tr>
                    </tfoot>
                </table>
            </div>
            <div class="tags-section">
                <div class="tags-header">
                    <h2>待配課程</h2>
                    <button id="add-course-btn" class="btn-primary">+ 新增課程</button>
                </div>
                <div id="tags-container" class="tags-container">
                    <!-- Tags will be generated by JS -->
                </div>
            </div>
        </main>
    </div>

    <!-- Add Course Modal -->
    <div id="add-course-modal" class="modal">
        <div class="modal-content">
            <h3>新增課程</h3>
            <div class="form-group">
                <label>課程名稱 (例如: 美術)</label>
                <input type="text" id="new-course-name" placeholder="輸入名稱">
            </div>
            <div class="form-group">
                <label>班級數量 (產生幾個標籤)</label>
                <input type="number" id="new-course-count" min="1" value="1">
            </div>
            <div class="form-group">
                <label>時數 (每週幾小時)</label>
                <input type="number" id="new-course-hours" min="1" value="2">
            </div>
            <div class="modal-actions">
                <button id="cancel-add-btn" class="btn-secondary">取消</button>
                <button id="confirm-add-btn" class="btn-primary">確認新增</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
